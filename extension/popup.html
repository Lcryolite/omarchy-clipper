<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Omarchy Clipper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body data-status="idle">
    <header>
      <span class="mark" aria-hidden="true"></span>
      <div><h1>Omarchy Clipper</h1><p id="header-context">Current page</p></div>
    </header>
    <main>
      <section class="capture-card" aria-labelledby="detected-heading">
        <p id="state-label" class="eyebrow">Detected content</p>
        <h2 id="detected-heading">Current page</h2>
        <p id="status" role="status" aria-live="polite">Ready to inspect this page.</p>
        <p id="detail" class="detail"></p>
      </section>
      <section id="capture-options" class="capture-options" aria-label="Capture choices" hidden>
        <fieldset id="scope-fieldset">
          <legend id="scope-legend">Capture scope</legend>
          <div id="scope-options" class="option-list"></div>
        </fieldset>
        <fieldset id="cleaning-fieldset" hidden>
          <legend id="cleaning-legend">Cleaning</legend>
          <label for="cleaning-standard"><input id="cleaning-standard" type="radio" name="cleaning" value="default" checked> <span id="cleaning-standard-label">Standard</span></label>
          <label for="cleaning-deep"><input id="cleaning-deep" type="radio" name="cleaning" value="deep"> <span id="cleaning-deep-label">Deep clean</span></label>
          <p id="cleaning-help">Deep clean also removes identified sponsorship, promotions, and badges.</p>
        </fieldset>
      </section>
      <div id="choices" class="choices" role="group" aria-label="Clip actions"></div>
      <div class="actions" role="group" aria-label="Capture actions">
        <button id="capture-article" class="primary" type="button">Capture</button>
        <button id="capture-selection" type="button">Save selection</button>
        <button id="capture-region" type="button">Capture region</button>
      </div>
    </main>
    <script src="dist/popup.js"></script>
  </body>
</html>
